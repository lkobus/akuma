name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências Python
        run: python -m pip install -r requirements.txt

      - name: Sintaxe dos scripts Python
        run: python -m compileall -q extract_cd.py patch_akuma.py localize.py localize_dialogues.py menu_labels.py hud_skin.py quest_starts.py

      - name: dialogues.json válido
        run: python -c "import json; json.load(open('dialogues.json', encoding='utf-8'))"

      - name: build.ps1 sem erro de sintaxe
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/build.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Compilar o launcher
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /platform:x86 /optimize+ /out:$env:RUNNER_TEMP\Jogar.exe Launcher.cs
          if ($LASTEXITCODE) { exit 1 }

      - name: Nenhum arquivo do jogo versionado
        shell: bash
        run: |
          bad=$(git ls-files | grep -i -E '\.(bin|cue|iso|exe|dll|zip|7z|pcx|cos)$' || true)
          if [ -n "$bad" ]; then echo "Arquivos proibidos no repositório:"; echo "$bad"; exit 1; fi
