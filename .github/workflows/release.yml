name: Release

# Disparado ao criar uma tag v* (ex.: v1.0.0). O job "publish" fica parado até
# o dono aprovar no GitHub (Environment "release" com Required reviewers).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar o launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path kit-bin | Out-Null
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /platform:x86 /optimize+ /out:kit-bin\Jogar.exe Launcher.cs
          if ($LASTEXITCODE) { exit 1 }

      - name: Empacotar o kit de build
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          git archive --format=zip --prefix="Akuma-Build-Kit-$tag/" -o "out\src.zip" HEAD
          Expand-Archive out\src.zip -DestinationPath out\stage
          Copy-Item kit-bin -Destination "out\stage\Akuma-Build-Kit-$tag\prebuilt" -Recurse
          Compress-Archive -Path "out\stage\Akuma-Build-Kit-$tag" -DestinationPath "out\Akuma-Build-Kit-$tag.zip"
          Remove-Item out\src.zip, out\stage -Recurse
          (Get-FileHash "out\Akuma-Build-Kit-$tag.zip" -Algorithm SHA256).Hash.ToLower() + "  Akuma-Build-Kit-$tag.zip" | Out-File out\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release   # exige aprovação manual
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
